# nuReasoning reasoning-only LoRA SFT — Qwen3-VL-8B-Instruct, multi-view multi-frame.

model_path: Qwen/Qwen3-VL-8B-Instruct

train_jsonl: ./reasoning_workspace/sft_train_multiframe.jsonl

output_dir: ./reasoning_workspace/lora_qwen3-vl-8b-multiframe
output_append_run_date: true

max_images: 16
max_pixels: 200704

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Effective batch on 8 GPUs = 8 * 2 * 4 = 64.
learning_rate: 5.0e-5
num_train_epochs: 1
max_steps: null
warmup_ratio: 0.03
weight_decay: 0.01
lr_scheduler_type: cosine
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
logging_steps: 5
save_steps: 200
save_total_limit: 3

bf16: true
fp16: false
gradient_checkpointing: true

max_seq_length: 28672
max_samples: null

seed: 42
